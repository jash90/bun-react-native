# TEMPORARY (PR #1): which condition makes `bun expo export --platform web` fail to resolve Metro's files on linux x64
name: debug-web
on: pull_request
jobs:
  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [control, fresh-home-each-run]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        if: startsWith(matrix.variant, 'setup-node')
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: 3 runs
        working-directory: example
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          set +e
          V=${{ matrix.variant }}
          touch /tmp/marker
          git -C .. status --porcelain --ignored -- example | grep -v node_modules > /tmp/before.txt
          echo "shell node: $(command -v node) $(node -p 'process.versions.bun || process.version')"
          for i in 1 2 3; do
            rm -rf web-bun .expo/cache; T=$PWD/tmp-bun-$i; mkdir -p $T
            [ $V = fresh-home-each-run ] && export HOME=$RUNNER_TEMP/home-$i && mkdir -p $HOME
            METRO_BUN_MINIFIER=0 TMPDIR=$T bun expo export --platform web --output-dir web-bun > /tmp/w$i.log 2>&1; r=$?
            echo "$V run $i: exit=$r"
            [ $r != 0 ] && grep -m2 -E 'Cannot find|Unexpected' /tmp/w$i.log
            echo "changed since previous run (outside example/tmp*, web*):"
            find .. "$HOME" /tmp -newer /tmp/marker -type f 2>/dev/null | grep -vE '/example/(tmp-bun|web-bun)|/tmp/(w[0-9]|marker)|/\.git/|/_temp/' | sed 's#/home/runner/work/bun-react-native/bun-react-native#REPO#' | head -40
            touch /tmp/marker
          done
          exit 0

# TEMPORARY (PR #1): which condition makes `bun expo export --platform web` fail to resolve Metro's files on linux x64
name: debug-web
on: pull_request
jobs:
  variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [system-node, shim-on-path, setup-node, setup-node-shim-on-path]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        if: startsWith(matrix.variant, 'setup-node')
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: 3 runs
        working-directory: example
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          set +e
          V=${{ matrix.variant }}
          case $V in *shim-on-path) chmod +x ../tools/bin/node; export PATH="$GITHUB_WORKSPACE/tools/bin:$PATH";; esac
          echo "shell node: $(command -v node) $(node -p 'process.versions.bun || process.version')"
          for i in 1 2; do
            rm -rf web-bun .expo/cache; T=$PWD/tmp-bun-$i; mkdir -p $T
            METRO_BUN_MINIFIER=0 TMPDIR=$T bun expo export --platform web --output-dir web-bun > /tmp/w$i.log 2>&1; r=$?
            echo "$V run $i: exit=$r"
            [ $r != 0 ] && head -40 /tmp/w$i.log
          done
          exit 0

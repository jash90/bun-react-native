# Repo root: the package's own tests (`bun test` -> tools/) and the workspace install (example/ is a member).
# The example app has its own bunfig.toml, the one `bunx bun-react-native init` writes into a project.

# The package preload (Node-compat shims, Jest under Bun, Expo CLI hooks, node shim first on PATH) - also for
# `bun test` of tools/, whose tests start Expo CLI / Metro code.
preload = ["./preload.js"]

# No automatic .env loading (like Node): the bundler and Expo CLI load .env.<mode> themselves (tools/bun-bundler/env.ts).
env = false

# Do not set `[run] bun = true`: like `--bun`, it puts Bun's `node` alias (oven-sh/bun#40482) in front of the shim.

[test]
root = "./tools"

[install]
# No auto-install at runtime: tools that probe global packages (Expo's sharp-cli lookup via require.resolve with global
# `paths`) would make Bun install them on the fly, which breaks later module resolution in that process
# (KNOWN-ISSUES #22). Node never installs on resolution either.
auto = "disable"
# Pin the public npm registry so bun.lock does not record a registry mirror from a personal ~/.npmrc.
registry = "https://registry.npmjs.org/"
# The isolated linker duplicates Expo native modules (oven-sh/bun#29343).
linker = "hoisted"

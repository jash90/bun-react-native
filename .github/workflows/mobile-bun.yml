# CI for the bun-react-native package and its example app (example/), "100% Bun".
# `node` on PATH is the Bun shim (tools/bin/node), so CocoaPods, Gradle and Xcode never run real Node. Runner images
# still ship Node (and setup-bun itself runs on the Actions node24 runtime) - it is just never reached by the
# toolchain; the `assert-no-node` step proves it. Real Node is installed only in bundle-determinism, as the reference.
name: mobile-bun

on:
  pull_request:
  push:
    branches: [main]

env:
  BUN_VERSION: 1.4.3
  EXPO_NO_TELEMETRY: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Put the node->bun shim first on PATH
        run: |
          chmod +x tools/bin/node
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - name: assert-no-node
        run: |
          test "$(command -v node)" = "$GITHUB_WORKSPACE/tools/bin/node"
          node -p "process.versions.bun" # fails on real Node
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test # the package's own tests (tools/)
      # Example app. No --bun anywhere: shebangs resolve `node` to the shim (= Bun); `bun --bun` would put Bun's buggy
      # `node` alias (oven-sh/bun#40482) in front of the shim for child processes.
      - run: bun run typecheck # bun check
        working-directory: example
      - run: bun run typecheck:tsc
        working-directory: example
      - run: bun run lint
        working-directory: example
      - run: bun run test --ci # Jest on the Bun runtime (tools/bun/jest.preload.js via the bunfig preload)
        working-directory: example
      - run: bunx bun-react-native doctor
        working-directory: example
      - name: Metro on Bun (default engine) -> Hermes bytecode
        working-directory: example
        run: |
          bun expo export:embed --platform android --dev false --minify false \
            --entry-file ../node_modules/expo-router/entry.js --bundle-output out/index.android.bundle \
            --assets-dest out/res --sourcemap-output out/index.android.bundle.map
          ../node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -emit-binary -O -out out/index.android.hbc out/index.android.bundle
      - name: expo export (iOS, Android - EAS Update layout, Hermes bytecode; web static) - Metro on Bun
        working-directory: example
        run: |
          bun expo export --output-dir dist
          test -f dist/metadata.json && test -f dist/index.html && test -f dist/explore.html
          ls dist/_expo/static/js/android/entry-*.hbc dist/_expo/static/js/ios/entry-*.hbc
      - name: expo export with the Bun bundler (RN_BUNDLER=bun) = Metro's file set and files
        working-directory: example
        run: |
          RN_BUNDLER=bun bun expo export --output-dir dist-bun
          bunx bun-react-native compare dist dist-bun

  # A project that installs the packed package and runs `init`, like a user would.
  consumer:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Pack the package and create a project outside the workspace
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          APP="$RUNNER_TEMP/app"
          mkdir -p "$APP" && cp -R example/. "$APP" && rm -rf "$APP/node_modules" "$APP/bunfig.toml"
          cd "$APP"
          # the app as it was before bun-react-native: no plugin, no postinstall of this repo
          bun -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json"));a.expo.plugins=a.expo.plugins.filter(p=>p!=="bun-react-native");fs.writeFileSync("app.json",JSON.stringify(a,null,2));const p=JSON.parse(fs.readFileSync("package.json"));delete p.scripts.postinstall;fs.writeFileSync("package.json",JSON.stringify(p,null,2))'
          echo "APP=$APP" >> "$GITHUB_ENV"
      - run: bun install
        working-directory: ${{ env.APP }}
      - run: bun add -d "$RUNNER_TEMP"/bun-react-native-*.tgz
        working-directory: ${{ env.APP }}
      - run: bunx bun-react-native init
        working-directory: ${{ env.APP }}
      - name: The usual commands
        working-directory: ${{ env.APP }}
        run: |
          bun run typecheck
          bun run test --ci
          bun expo export --platform android --output-dir dist
          ls dist/_expo/static/js/android/entry-*.hbc

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          chmod +x tools/bin/node
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun expo prebuild --platform android --no-install
        working-directory: example
      - run: ./gradlew assembleRelease
        working-directory: example/android

  ios:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          chmod +x tools/bin/node
          echo "$GITHUB_WORKSPACE/tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun expo prebuild --platform ios --no-install
        working-directory: example
      # expo-modules-autolinking writes ios/.xcode.env.local with NODE_BINARY=<bun> during pod install
      - run: pod install
        working-directory: example/ios
      - run: >
          xcodebuild -workspace *.xcworkspace -scheme "$(basename *.xcworkspace .xcworkspace)"
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          COMPILER_INDEX_STORE_ENABLE=NO build
        working-directory: example/ios

  # Metro on Bun (the default engine) must stay byte-identical to Metro on Node (oven-sh/bun#44947 and regressions).
  bundle-determinism:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4 # real Node used ONLY as the reference here
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Bundle with Node and with Bun, compare bytes
        working-directory: example
        run: |
          NODE="$(command -v node)" # real Node, before anything puts the shim first
          ENTRY="$(bun -p "require.resolve('expo-router/entry')")"
          for rt in node bun; do
            # Separate TMPDIR per runtime: Metro's disk cache lives in $TMPDIR/metro-cache and is reused even with
            # --reset-cache, which would let the Bun run serve modules transformed by the Node run.
            mkdir -p out-$rt/assets tmp-$rt && rm -rf .expo/cache
            if [ $rt = node ]; then RUN="$NODE ../node_modules/expo/bin/cli"; else RUN="bun expo"; fi
            # --minify false: what native Hermes release builds do (Gradle/Xcode)
            TMPDIR=$PWD/tmp-$rt $RUN export:embed --platform android --dev false --minify false --entry-file "$ENTRY" \
              --bundle-output out-$rt/index.android.bundle --assets-dest out-$rt/assets --reset-cache
            # web (minified): Bun's minifier intentionally differs from terser - compare with terser on both
            METRO_BUN_MINIFIER=0 TMPDIR=$PWD/tmp-$rt $RUN export --platform web --output-dir web-$rt
          done
          cmp out-node/index.android.bundle out-bun/index.android.bundle
          diff -r out-node/assets out-bun/assets
          diff -r web-node web-bun

  # Next Expo SDK (expo@next, SDK 58): the toolchain on a copy of the example upgraded with `expo install --fix`.
  # The example's own code targets SDK 57 (typecheck/Jest are not run here); this checks bundling only.
  sdk-next:
    runs-on: ubuntu-latest
    needs: checks
    continue-on-error: true # SDK prereleases move; a failure here is a signal, not a blocker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4 # real Node used ONLY as the reference
        with:
          node-version: 22
      - name: Example copy on expo@next with the packed package
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          # no bunfig.toml until the package is installed: its preload must resolve (KNOWN-ISSUES #20)
          APP="$RUNNER_TEMP/next" && mkdir -p "$APP" && cp -R example/. "$APP" && rm -rf "$APP/node_modules" "$APP/bunfig.toml"
          cd "$APP"
          bun -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));delete p.scripts.postinstall;p.dependencies.expo="next";fs.writeFileSync("package.json",JSON.stringify(p,null,2))'
          bun install
          bun x expo install --fix
          RN="$(bun -p 'require("react-native/package.json").version')"
          bun add -d "@react-native/metro-config@$RN" "@react-native/jest-preset@$RN" "$RUNNER_TEMP"/bun-react-native-*.tgz
          bunx bun-react-native init
          echo "APP=$APP" >> "$GITHUB_ENV"
      - run: bunx bun-react-native doctor
        working-directory: ${{ env.APP }}
      - name: Metro on Bun = Metro on Node (Android release bundle)
        working-directory: ${{ env.APP }}
        run: |
          NODE="$(command -v node)"; ENTRY="$(bun -p "require.resolve('expo-router/entry')")"
          for rt in node bun; do
            mkdir -p out-$rt/assets tmp-$rt
            if [ $rt = node ]; then RUN="$NODE node_modules/expo/bin/cli"; else RUN="bun expo"; fi
            TMPDIR=$PWD/tmp-$rt $RUN export:embed --platform android --dev false --minify false --entry-file "$ENTRY" \
              --bundle-output out-$rt/index.android.bundle --assets-dest out-$rt/assets --reset-cache
          done
          cmp out-node/index.android.bundle out-bun/index.android.bundle
          diff -r out-node/assets out-bun/assets
      - run: bun expo export --output-dir dist
        working-directory: ${{ env.APP }}

# Bun configuration for the React Native toolchain. See docs/bun-react-native/RUNBOOK.md.
# Bun reads this file only from the current working directory - keep it next to package.json.

# Node-compat shims loaded into every Bun process started here (CLI, Metro, Jest and forked workers;
# NOT worker_threads - see metro.config.js).
preload = ["./tools/bun/node-compat.preload.js", "./tools/bun/jest.preload.js"]

# No automatic .env loading (like Node): the bundler and Expo CLI load .env.<mode> for the command's mode
# themselves (tools/bun-bundler/env.ts); Bun would pick .env.development for release bundles.
env = false

# Do not set `[run] bun = true`: like `--bun`, it puts Bun's `node` alias (oven-sh/bun#40482) in front of
# tools/bin/node for child processes.

[test]
# `bun test` covers the Bun-only toolchain code in tools/; app tests (React Native) run on Jest.
root = "./tools"

[install]
# Pin the public npm registry so bun.lock does not record a registry mirror from a personal ~/.npmrc.
registry = "https://registry.npmjs.org/"
# The isolated linker duplicates Expo native modules (oven-sh/bun#29343).
linker = "hoisted"
